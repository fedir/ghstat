version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: ghstat
    main: .
    binary: ghstat
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

brews:
  - name: ghstat
    repository:
      owner: fedir
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/fedir/ghstat"
    description: "Statistical multi-criteria comparator for GitHub projects."
    license: "GPL-3.0"
    test: |
      assert_match "ghstat", shell_output("#{bin}/ghstat -version")
